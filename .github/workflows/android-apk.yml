name: Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build both Android apps
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug :music:assembleDebug --stacktrace --warning-mode all > build.log 2>&1
          result=$?
          tail -n 180 build.log
          exit $result
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-apps-build-diagnostics
          path: build.log
          if-no-files-found: ignore
      - name: Upload iOS Experience launcher APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Experience-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Sonic Music v40 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Music-v40-debug
          path: music/build/outputs/apk/debug/music-debug.apk
